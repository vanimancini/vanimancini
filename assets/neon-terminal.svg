<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#171529"/><stop offset=".48" stop-color="#3b3150"/><stop offset="1" stop-color="#d29a63"/></linearGradient>
 <linearGradient id="brass"><stop stop-color="#f7d58a"/><stop offset=".35" stop-color="#a96932"/><stop offset=".7" stop-color="#f2c36b"/><stop offset="1" stop-color="#73401f"/></linearGradient>
 <linearGradient id="glass"><stop stop-color="#aef4ed" stop-opacity=".7"/><stop offset="1" stop-color="#326a72" stop-opacity=".25"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#080711" flood-opacity=".7"/></filter>
 <pattern id="rivets" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.3" fill="#eac77b" opacity=".25"/></pattern>
</defs>
<rect width="1200" height="420" rx="22" fill="url(#sky)"/><rect width="1200" height="420" rx="22" fill="url(#rivets)"/>
<!-- moon and clouds -->
<circle cx="1015" cy="92" r="52" fill="#f9e6b8" opacity=".88" filter="url(#glow)"/>
<g fill="#e8d8ca" opacity=".18"><ellipse cx="1020" cy="155" rx="180" ry="25"/><ellipse cx="945" cy="150" rx="95" ry="33"/><ellipse cx="170" cy="115" rx="150" ry="24"/><ellipse cx="95" cy="108" rx="80" ry="34"/></g>
<!-- distant airships -->
<g stroke="#e8c276" fill="none" opacity=".7"><ellipse cx="920" cy="112" rx="48" ry="16"/><path d="M880 112h80M904 128l8 13h24l7-14"/><path d="M920 96v-9"/><ellipse cx="180" cy="155" rx="34" ry="11"/><path d="M151 155h58M170 166l6 9h16l6-9"/></g>
<!-- floating rock -->
<path d="M676 282L1115 282 1037 405 940 370 865 414 790 361 724 382Z" fill="#17131c" stroke="#6f4c39"/>
<!-- castle silhouette -->
<g filter="url(#shadow)">
 <path d="M720 285v-89h34v-58l16-21 16 21v58h42V98l20-29 20 29v186h52V159h38v-42l18-25 18 25v42h43v126Z" fill="#1b1820" stroke="url(#brass)" stroke-width="3"/>
 <path d="M748 196h47M819 124h58M910 159h94" stroke="#d19b55" opacity=".55"/>
 <g fill="url(#glass)" stroke="#e1bd74"><path d="M842 116h13v31h-13Z"/><path d="M842 172h13v31h-13Z"/><path d="M948 184h14v27h-14Z"/><path d="M761 221h13v26h-13Z"/></g>
 <path d="M830 284v-52a24 24 0 0148 0v52" fill="#0c1114" stroke="#c48a48"/>
</g>
<!-- gears -->
<g fill="none" stroke="url(#brass)" filter="url(#glow)" opacity=".9"><circle cx="1060" cy="275" r="42" stroke-width="7"/><circle cx="1060" cy="275" r="12" stroke-width="5"/><path d="M1060 225v25M1060 300v25M1010 275h25M1085 275h25M1025 240l18 18M1077 292l18 18M1095 240l-18 18M1043 292l-18 18" stroke-width="6"/></g>
<!-- brass console -->
<rect x="65" y="55" width="610" height="282" rx="10" fill="#100f15" fill-opacity=".94" stroke="url(#brass)" stroke-width="3" filter="url(#shadow)"/>
<path d="M65 96h610" stroke="#8f5c30"/><circle cx="91" cy="76" r="7" fill="#7e392d" stroke="#dca561"/><circle cx="116" cy="76" r="7" fill="#bd7b38" stroke="#f0cb7a"/><circle cx="141" cy="76" r="7" fill="#477d68" stroke="#9ce0bc"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
 <text x="172" y="82" fill="#ae8b62" font-size="13">AIRBORNE CITADEL // COMMAND DECK</text>
 <text x="94" y="133" fill="#f2c36b" font-size="15">$ identify --captain</text>
 <text x="94" y="187" fill="#fff3d2" font-family="Georgia,serif" font-size="45" font-weight="700" letter-spacing="6">VANI MANCINI</text>
 <text x="97" y="225" fill="#d89e5c" font-size="15">SYSTEMS ENGINEER · KEEPER OF THE ENGINES</text>
 <text x="97" y="263" fill="#9fe0d3" font-size="14">steady hands / daring heart / meticulous craft</text>
 <text x="97" y="302" fill="#c1a787" font-size="13">coordinates: TAIWAN   altitude: ABOVE THE CLOUDS</text>
 <rect x="594" y="288" width="9" height="17" fill="#f2c36b"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
</g>
<!-- frame corners -->
<g fill="#f1c46d"><circle cx="76" cy="66" r="3"/><circle cx="664" cy="66" r="3"/><circle cx="76" cy="326" r="3"/><circle cx="664" cy="326" r="3"/></g>
<text x="922" y="345" fill="#e1bd74" font-family="Georgia,serif" font-size="14" letter-spacing="3">THE SKYWARD ATELIER</text>
</svg>